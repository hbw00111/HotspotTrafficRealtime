name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build release app
        run: ./scripts/build-app.sh
      - name: Run core verification
        run: ./scripts/verify-core.sh
      - name: Package app
        run: ./scripts/package-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: HotspotTraffic-macOS
          path: outputs/HotspotTraffic-v*-macOS-*.zip
